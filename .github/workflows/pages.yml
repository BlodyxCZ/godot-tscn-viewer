name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  runtime:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - line: "4.3"
            tag: "4.3-stable"
          - line: "4.4"
            tag: "4.4.1-stable"
          - line: "4.5"
            tag: "4.5.2-stable"
          - line: "4.6"
            tag: "4.6.3-stable"
          - line: "4.7"
            tag: "4.7.2-stable"
          - line: "4.8"
            tag: "4.8-dev3"
    steps:
      - name: Restore shared Godot Web runtime cache
        id: runtime-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/godot-tscn-viewer/runtime/${{ matrix.line }}
          key: godot-tscn-viewer-web-runtime-${{ matrix.line }}-${{ matrix.tag }}-nothreads-v1

      - name: Build shared Godot Web runtime cache
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GODOT_LINE: ${{ matrix.line }}
          GODOT_RELEASE_TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE_TAG}/Godot_v${GODOT_RELEASE_TAG}_export_templates.tpz"
          curl -fL "$URL" -o "$RUNNER_TEMP/templates.tpz"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/export-templates"
          TEMPLATE="$RUNNER_TEMP/export-templates/templates/web_nothreads_release.zip"
          test -s "$TEMPLATE"

          CACHE="$HOME/.cache/godot-tscn-viewer/runtime/${GODOT_LINE}"
          mkdir -p "$CACHE"
          unzip -q "$TEMPLATE" -d "$CACHE"
          test -s "$CACHE/godot.js"
          test -s "$CACHE/godot.wasm"
          rm -f "$CACHE/godot.html" "$CACHE/godot.offline.html" "$CACHE/godot.service.worker.js"

      - name: Upload runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.line }}
          path: ~/.cache/godot-tscn-viewer/runtime/${{ matrix.line }}
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: [test, runtime]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage static site
        shell: bash
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '_site' ./ _site/

      - name: Stage shared Godot Web runtimes
        uses: actions/download-artifact@v4
        with:
          pattern: 4.*
          path: _site/runtime

      - name: Verify runtime layout
        shell: bash
        run: |
          set -euo pipefail
          for VERSION in 4.3 4.4 4.5 4.6 4.7 4.8; do
            test -s "_site/runtime/$VERSION/godot.js"
            test -s "_site/runtime/$VERSION/godot.wasm"
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
