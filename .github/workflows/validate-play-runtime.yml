name: Validate Play Runtime

on:
  push:
    branches: [feat/playable-previews]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7"

jobs:
  validate-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Web export templates
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GODOT_VERSION}-stable"
          curl -fL "https://github.com/godotengine/godot/releases/download/${TAG}/Godot_v${TAG}_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/export-templates"
          TEMPLATE="$RUNNER_TEMP/export-templates/templates/web_nothreads_release.zip"
          test -s "$TEMPLATE"
          unzip -l "$TEMPLATE"

      - name: Extract shared browser runtime
        shell: bash
        run: |
          set -euo pipefail
          TEMPLATE="$RUNNER_TEMP/export-templates/templates/web_nothreads_release.zip"
          OUT="$RUNNER_TEMP/runtime"
          mkdir -p "$OUT"
          unzip -q "$TEMPLATE" -d "$OUT"
          find "$OUT" -maxdepth 2 -type f -printf '%P %s bytes\n' | sort
          test -s "$OUT/godot.js"
          test -s "$OUT/godot.wasm"

      - name: Validate viewer tests and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          npm test
          find src runner -name '*.js' -print0 | xargs -0 -n1 node --check
